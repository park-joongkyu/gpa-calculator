<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>학점 계산기</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎓</text></svg>">
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <header class="app-header">
      <h1>학점 계산기</h1>
      <p class="subtitle">학기별로 과목을 입력하면 학기 평점과 전체 누적 평점을 함께 계산해드려요</p>
    </header>

    <div class="toolbar">
      <label for="scale-select">등급 체계</label>
      <select id="scale-select">
        <option value="4.5">4.5 만점 (A+ 4.5 · B+ 3.5 · C+ 2.5 …)</option>
        <option value="4.3">4.3 만점 (A+ 4.3 · A0 4.0 · A- 3.7 …)</option>
        <option value="4.0">4.0 만점 (A+/A 4.0 · A- 3.7 · B+ 3.3 …)</option>
      </select>
    </div>

    <section class="summary overall-summary">
      <div class="summary-item">
        <span class="summary-label">총 이수학점</span>
        <span class="summary-value" id="total-credits">0</span>
      </div>
      <div class="summary-item highlight">
        <span class="summary-label">전체 평점</span>
        <span class="summary-value" id="gpa-result">0.00</span>
      </div>
      <div class="summary-item">
        <span class="summary-label">전공 평점</span>
        <span class="summary-value" id="major-gpa-result">0.00</span>
      </div>
      <div class="summary-item">
        <span class="summary-label">100점 환산</span>
        <span class="summary-value" id="percent-result">0.0</span>
      </div>
    </section>

    <div id="semester-list"></div>
    <button id="add-semester-btn" class="add-btn" type="button">+ 학기 추가</button>

    <section class="target-tool">
      <h2>목표 평점 계산기</h2>
      <p class="tool-desc">지금까지의 누적 학점·평점을 기준으로, 남은 학점에서 평균 몇 점을 받아야 목표 평점을 맞출 수 있는지 계산해요.</p>
      <div class="target-inputs">
        <label>목표 평점
          <input id="target-gpa" type="number" min="0" step="0.01" placeholder="예: 4.0">
        </label>
        <label>남은 학점
          <input id="remaining-credits" type="number" min="0" step="0.5" placeholder="예: 15">
        </label>
      </div>
      <p class="target-result" id="target-result">과목을 입력하고 목표 평점과 남은 학점을 채워주세요.</p>
    </section>

    <div class="footer-actions">
      <button id="reset-btn" class="reset-btn" type="button">전체 초기화</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
